# Warum es diese Datei gibt:
# Vercel baut bei jedem Push selbst – aber ein kaputter Build fällt dort erst nach dem Deploy-Versuch auf.
# Dieser Workflow ist ein SIGNAL, kein Tor: er zeigt im PR/Commit sofort, ob Typprüfung und Build durchlaufen.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
